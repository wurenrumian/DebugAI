version: '3.8'

# ============================================================
# AI 服务独立部署配置
#
# 用途：单独启动 Python AI 服务（用于开发测试）
# 注意：完整部署请使用根目录 docker-compose.yml
#
# 使用方法：
# 1. 设置环境变量：
#    Windows: $env:DEEPSEEK_API_KEY="your-api-key"
#    Linux/macOS: export DEEPSEEK_API_KEY="your-api-key"
# 2. 启动服务：docker-compose up
# 3. 健康检查：http://localhost:8000/health
# ============================================================

services:
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: debugai-ai-service
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      ENV: ${ENV:-development}
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\"" ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - debugai-network

networks:
  debugai-network:
    driver: bridge