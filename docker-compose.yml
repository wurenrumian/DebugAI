# DebugAI 项目 Docker Compose 编排配置
# 用途：一键启动所有服务（PostgreSQL、Redis、Go后端、Python AI服务、Vue前端）
# 使用方法：docker-compose up -d

services:
  # PostgreSQL 16 数据库
  postgres:
    image: postgres:16-alpine
    container_name: debugai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-debugai}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend-go/config/postgresql.conf:/etc/postgresql/postgresql.conf
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - debugai-network

  # Redis 7 缓存服务
  redis:
    image: redis:7-alpine
    container_name: debugai-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - debugai-network

  # Go 后端 API 服务
  backend:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    container_name: debugai-backend
    environment:
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-debugai}
      DB_PORT: 5432
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-your-strong-secret-key-min-32-chars}
      AI_SERVICE_URL: http://ai-service:8000
      ENV: ${ENV:-development}
      # 邮箱验证配置
      SKIP_EMAIL_VERIFICATION: ${SKIP_EMAIL_VERIFICATION:-false}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - debugai-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Python AI 服务
  ai-service:
    build:
      context: ./ai-python
      dockerfile: Dockerfile
    container_name: debugai-ai-service
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      ENV: ${ENV:-development}
    ports:
      - "${AI_PORT:-8000}:8000"
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\"" ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - debugai-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Vue 前端服务
  frontend:
    build:
      context: ./frontend-vue
      dockerfile: Dockerfile
    container_name: debugai-frontend
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8080}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
      - ai-service
    restart: unless-stopped
    networks:
      - debugai-network

volumes:
  postgres_data:
  redis_data:

networks:
  debugai-network:
    driver: bridge