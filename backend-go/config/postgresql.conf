# PostgreSQL Configuration for DebugAI - Docker 2GB 内存测试版
# 日期参考：2026 年 3 月
# 目标：避免 OOM / 启动失败，适合小型测试负载

# ================== 连接与进程 ==================
max_connections = 50                  # 保持原值，但低内存下建议监控；多了容易 OOM
max_replication_slots = 10            # 保持原值

# ================== 内存核心（最关键调整） ==================
shared_buffers = 384MB                # 改为固定值 ≈15-20%，原 25% 太危险
effective_cache_size = 1GB            # 给优化器提示，设大点无副作用
work_mem = 4MB                        # 每个操作内存，防止单查询爆内存
maintenance_work_mem = 64MB           # VACUUM / INDEX 等用
wal_buffers = -1                      # 自动 ≈ shared_buffers / 32 ≈ 12MB

# ================== Huge Pages - Docker 安全选择 ==================
huge_pages = try                      # 强烈推荐！原 'on' 在 Docker 几乎必失败

# ================== WAL 与 Checkpoint ==================
min_wal_size = 256MB                  # 原 1GB 偏大，低内存下调小避免 checkpoint IO 尖峰
max_wal_size = 1GB                    # 补充设置（原配置缺少）
checkpoint_completion_target = 0.9    # 补充，平滑 checkpoint
checkpoint_warning = 300s             # 原 30s 太敏感，改成 5 分钟

# ================== 日志（保持友好） ==================
logging_collector = on
log_destination = 'csvlog'
log_rotation_size = 100MB             # 保持原值
log_min_duration_statement = 500ms    # 保持原值
log_line_prefix = '%m [%p] %q%u@%d '  # 补充，便于排查
log_checkpoints = on                  # 补充，监控 checkpoint

# ================== 规划与 IO 优化 ==================
random_page_cost = 1.1                # 保持原值，SSD 友好
effective_io_concurrency = 200        # 补充，SSD/NVMe 环境推荐
default_statistics_target = 100       # 补充，默认就好

# ================== 其他 ==================
cluster_name = 'debugai-pg-cluster'   # 保持原值
autovacuum = on                       # 默认开，保持
autovacuum_max_workers = 3            # 低内存下别太多

# ================== 归档 - 测试环境先关闭（高风险） ==================
archive_mode = off
# archive_command = 'test ! -f /var/lib/postgresql/data/archivedir/%f && cp %p /var/lib/postgresql/data/archivedir/%f'
# 说明：原路径放在 data 里 → 容器重启/删除 WAL 归档丢失；cp 阻塞风险高
# 等升级内存 + 独立 volume 后再开，路径改成 /archive/%f