version: '3.8'

# ============================================================
# Go 后端服务独立部署配置
#
# 用途：单独启动 Go 后端和 PostgreSQL 数据库（用于本地开发）
# 注意：完整部署请使用根目录 docker-compose.yml
#
# 使用方法：
# 1. 仅启动数据库：docker-compose up postgres
# 2. 启动后端（需先设置环境变量）：
#    Windows: $env:DB_HOST="localhost"; $env:DB_USER="postgres"; $env:DB_PASSWORD="password"; $env:DB_NAME="debugai"; $env:DB_PORT="5432"
#    Linux/macOS: export DB_HOST=localhost DB_USER=postgres DB_PASSWORD=password DB_NAME=debugai DB_PORT=5432
#    然后运行：go run main.go
# 3. 完整容器化部署：docker-compose up --build
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: debugai-dev-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: debugai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: debugai-backend
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: debugai
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
